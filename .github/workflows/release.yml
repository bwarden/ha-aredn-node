name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    name: Package integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build zip
        run: scripts/package "${{ github.ref_name }}"

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          files: aredn_node-*.zip